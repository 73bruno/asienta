; Restaurants, bars, cafés, catering. The AI puts every invoice line in one of these categories
; and each category has its purchases account: the wine on a food wholesaler's invoice goes to
; drinks without anyone touching it.
;   name = account | what goes in it (the AI reads this)

[company]
activity = restaurant

[categories]
food = 600000100 | food, ingredients, sauces, condiments
drinks = 600000200 | wine, beer, soft drinks, water, spirits, coffee and tea; deposits and returns of crates, bottles and kegs
packaging = 600000300 | bags, film, boxes, disposable cups and containers bought to be used
cleaning = 600000400 | cleaning products

[split]
only_prefixes = 600
follow_main = packaging
follow_when = food, drinks
