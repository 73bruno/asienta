; The demo: a fictional restaurant with a fictional ledger. `asienta --demo` uses this file.

[app]
preset = hospitality
language = en
today = 2026-09-24            ; pinned so the demo looks the same whenever you run it

[brand]
name = Asienta
tagline = Supplier invoices
accent = #4F46E5

[company]
name = Demo Bistro, S.L.
tax_id = B98765431
activity = restaurant

[reader]
provider = demo
model = demo

[ledger]
source = demo
vat_filed_until = 2026-06
suggest_prefixes = 6,21

[accounts]
withholding = 475100000

[export]
format = sage50

[mailbox]
; no server: the demo simulates incoming email (Mailbox › "Send a test email")
address = invoices@demobistro.example
