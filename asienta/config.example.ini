; ─────────────────────────────────────────────────────────────────────────────
;  Asienta · configuration
;  Copy to config.ini (`asienta init` does it) and fill in. Secrets are better
;  kept in environment variables: GEMINI_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY,
;  ASIENTA_TOKEN, ASIENTA_SAGE50_PASSWORD, ASIENTA_MAILBOX_PASSWORD, HOLDED_API_KEY.
; ─────────────────────────────────────────────────────────────────────────────

[app]
; start from a preset in asienta/presets (hospitality, retail, services) and override below
preset = hospitality
language = es                 ; es | en  (the UI can switch too)
host = 127.0.0.1              ; anything else requires an access token
port = 8760
data = data                   ; database, documents and export files
access_token =                ; or ASIENTA_TOKEN
allowed_hosts =               ; extra host names allowed in the Host header

[brand]
; make it yours: name, accent colour and logo shown in the app
name = Asienta
tagline =
accent = #4F46E5
logo =                        ; path to a PNG or SVG

[company]
; the company that RECEIVES the invoices
name = Tu Empresa, S.L.
tax_id = B00000000
activity = restaurant         ; a few words: helps the AI classify lines

[reader]
; the AI model that reads the documents. Swap it without touching anything else:
;   gemini  -> model = gemini-3.8-flash                     (GEMINI_API_KEY)
;   claude  -> model = claude-opus-5 / claude-sonnet-5 / claude-haiku-4-5   (ANTHROPIC_API_KEY)
;   openai  -> any OpenAI-compatible API: OpenAI, Mistral, OpenRouter, Azure... (OPENAI_API_KEY)
;              or a LOCAL model: base_url = http://localhost:11434/v1 (Ollama), model = llama3.2-vision
provider = gemini
model = gemini-3.8-flash
api_key =                     ; better in the environment variable of the provider
base_url =                    ; openai provider only
pdf =                         ; openai provider: file | images (images needs pymupdf)
concurrency = 3
timeout = 60
; $ per million tokens, only to show the cost (defaults known for common models)
price_input =
price_output =

[ledger]
source = csv                  ; csv | sage50
; csv: a folder with accounts.csv (+ history.csv, booked.csv). See docs/ledger.md
folder = ledger
; or Sage 50 / ContaPlus subaccounts export (XSUBCTA .csv) instead of accounts.csv
contaplus_accounts =
refresh_minutes = 30
supplier_prefixes = 400,410
expense_prefixes = 6,2
suggest_prefixes = 6,21       ; accounts the AI may suggest for a supplier with no history
vat_filed_until = auto        ; auto (by Spanish deadlines) | YYYY-MM | off

[sage50]
; read-only login on Sage 50's SQL Server (db_datareader). Used when [ledger] source = sage50
server =
port = 1433
user =
password =                    ; or ASIENTA_SAGE50_PASSWORD
database =
tax_id_table = proveed
tax_id_code = CODIGO
tax_id_column = CIF
number_column = NUMFRA

[accounts]
; input VAT account per rate. Empty = found in the chart of accounts ("IVA soportado 21%")
input_vat =                   ; e.g. 21:472000021, 10:472000010, 4:472000004
withholding = 475100000       ; IRPF withheld from professionals

; [categories] and [split] come from the preset. Override them here to fit your chart of accounts:
;
; [categories]
; food = 600000100 | food, ingredients, sauces, condiments
; drinks = 600000200 | wine, beer, soft drinks, water, coffee
;
; [split]
; only_prefixes = 600         ; split by category only when the main account starts like this
; follow_main = packaging     ; categories that stay with the main account...
; follow_when = food, drinks  ; ...when the main account is one of these (crate deposits -> drinks)

[export]
format = sage50               ; sage50 | contaplus | sage50xls | a3 | holded | xero | quickbooks | csv | json
description = S/ FRA. [{number}] {supplier}
description_length = 25
first_entry = 1               ; sage50: entry number of the first invoice (the add-on renumbers)
drop_folder =                 ; also copy every export file here
fixed_name =                  ; ...and once more with this fixed name (e.g. PARA_IMPORTAR.csv)

[a3]
company_code = 00001

[holded]
push = false                  ; true = also send each bill to the Holded API
api_key =                     ; or HOLDED_API_KEY

[xero]
tax_types =                   ; e.g. 21:INPUT21, 10:INPUT10

[quickbooks]
tax_codes =

[inbox]
; a folder to watch: a scanner's scan-to-folder, a synced Dropbox / OneDrive / shared drive.
; Files are taken every 30 s and moved to done/ inside it. Leave empty to disable
folder =

[mailbox]
; an inbox only for invoices (IMAP). Leave server empty to disable
server =
port = 993
user =
password =                    ; an app password; or ASIENTA_MAILBOX_PASSWORD
folder = INBOX
every_minutes = 5
max_per_pass = 20
address =                     ; shown in the app ("forward invoices to ...")
allowed_senders =             ; addresses or domains; empty = anyone
