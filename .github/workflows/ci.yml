name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest ruff openpyxl
      - run: ruff check .
      - run: pytest -q
      - name: The demo starts
        run: |
          asienta --demo --no-browser --port 8799 &
          for i in $(seq 1 20); do curl -sf localhost:8799/api/version && break; sleep 0.5; done
          curl -sf localhost:8799/api/state | grep -q "Demo Bistro"
